<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Honey Token System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #0a0a0f;
            --surface: #101018;
            --rule: #1e1e2c;
            --rule-bright: #2d2d40;
            --text: #d4d0c8;
            --text-dim: #4a4a62;
            --red: #c23b22;
            --red-dim: #1e100c;
            --red-mid: #5a1e12;
            --mono: 'DM Mono', monospace;
            --sans: 'Syne', sans-serif;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: var(--mono);
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            position: relative;
            overflow: hidden;
        }

        /* Background grid */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(var(--rule) 1px, transparent 1px),
                linear-gradient(90deg, var(--rule) 1px, transparent 1px);
            background-size: 48px 48px;
            opacity: 0.5;
            pointer-events: none;
        }

        /* Vignette */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse 70% 70% at 50% 50%, transparent 40%, var(--bg) 100%);
            pointer-events: none;
        }

        /* ── LOCK MARK ── */
        .lock-mark {
            width: 56px;
            height: 56px;
            border: 2px solid var(--rule-bright);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 28px;
            position: relative;
            z-index: 1;
        }

        .lock-mark svg {
            width: 22px;
            height: 22px;
            stroke: var(--text-dim);
            fill: none;
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ── CARD ── */
        .card {
            position: relative;
            z-index: 1;
            width: 360px;
            border: 1px solid var(--rule-bright);
            background: var(--surface);
        }

        .card-header {
            padding: 28px 32px 0;
            border-bottom: 1px solid var(--rule);
            padding-bottom: 24px;
        }

        .system-label {
            font-size: 10px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--text-dim);
            margin-bottom: 8px;
        }

        .card-title {
            font-family: var(--sans);
            font-size: 22px;
            font-weight: 800;
            color: #fff;
            letter-spacing: -0.02em;
        }

        .card-body {
            padding: 28px 32px;
        }

        /* ── ERROR ── */
        .error-box {
            background: var(--red-dim);
            border: 1px solid var(--red-mid);
            padding: 12px 14px;
            margin-bottom: 20px;
            font-size: 12px;
            color: var(--red);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .error-box::before {
            content: '!';
            width: 16px; height: 16px;
            border: 1px solid var(--red);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 10px;
            font-weight: 500;
        }

        /* ── FORM ── */
        .field {
            margin-bottom: 16px;
        }

        .field-label {
            display: block;
            font-size: 10px;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--text-dim);
            margin-bottom: 8px;
        }

        .field-input {
            width: 100%;
            padding: 12px 14px;
            background: var(--bg);
            border: 1px solid var(--rule-bright);
            color: var(--text);
            font-family: var(--mono);
            font-size: 13px;
            outline: none;
            transition: border-color 0.15s;
            -webkit-appearance: none;
        }

        .field-input::placeholder { color: var(--text-dim); }

        .field-input:focus {
            border-color: var(--red-mid);
            background: #0d0d14;
        }

        .btn-login {
            width: 100%;
            margin-top: 24px;
            padding: 14px;
            background: var(--bg);
            border: 1px solid var(--rule-bright);
            color: var(--text);
            font-family: var(--mono);
            font-size: 11px;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            cursor: pointer;
            transition: border-color 0.15s, color 0.15s, background 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-login:hover {
            border-color: var(--red-mid);
            color: #fff;
            background: var(--red-dim);
        }

        .btn-login:active { opacity: 0.8; }

        /* ── FOOTER BAR ── */
        .card-footer {
            padding: 14px 32px;
            border-top: 1px solid var(--rule);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .footer-dot {
            width: 6px; height: 6px;
            background: var(--red);
            border-radius: 50%;
        }

        .footer-text {
            font-size: 10px;
            letter-spacing: 0.1em;
            color: var(--text-dim);
            text-transform: uppercase;
        }

        /* ── BREADCRUMB BELOW CARD ── */
        .meta-row {
            margin-top: 24px;
            position: relative;
            z-index: 1;
            font-size: 11px;
            color: var(--text-dim);
            text-align: center;
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body>

    <div class="lock-mark">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <rect x="3" y="11" width="18" height="11" rx="1"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
    </div>

    <div class="card">
        <div class="card-header">
            <p class="system-label">HoneyToken System</p>
            <h1 class="card-title">Admin Access</h1>
        </div>

        <div class="card-body">
            {% if error %}
            <div class="error-box">{{ error }}</div>
            {% endif %}

            <form method="POST">
                <div class="field">
                    <label class="field-label" for="username">Username</label>
                    <input
                        class="field-input"
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter username"
                        autocomplete="username"
                        required
                    >
                </div>
                <div class="field">
                    <label class="field-label" for="password">Password</label>
                    <input
                        class="field-input"
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button class="btn-login" type="submit">
                    Authenticate
                    <span>→</span>
                </button>
            </form>
        </div>

        <div class="card-footer">
            <div class="footer-dot"></div>
            <span class="footer-text">Unauthorized access is monitored and logged</span>
        </div>
    </div>

    <div class="meta-row">
        All sessions are recorded &nbsp;·&nbsp; Access attempts are traced
    </div>

</body>
</html>
