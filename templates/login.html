<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | HoneyToken Secure Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #030307;
            --surface: rgba(13, 13, 23, 0.7);
            --rule: rgba(255, 255, 255, 0.07);
            --rule-bright: rgba(255, 255, 255, 0.15);
            --text: #e1e1e9;
            --text-dim: #70708f;
            --accent: #ff5533;
            --accent-glow: rgba(255, 85, 51, 0.25);
            --accent-dim: rgba(255, 85, 51, 0.05);
            --sans: 'Outfit', sans-serif;
            --mono: 'DM Mono', monospace;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: var(--sans);
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            position: relative;
            overflow: hidden;
        }

        /* Ambient grid pattern background */
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(var(--rule) 1px, transparent 1px),
                linear-gradient(90deg, var(--rule) 1px, transparent 1px);
            background-size: 40px 40px;
            opacity: 0.75;
            pointer-events: none;
            z-index: 0;
        }

        /* Abstract glowing blobs for premium design */
        .glowing-blob {
            position: absolute;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
            top: 20%;
            left: 15%;
            filter: blur(40px);
            pointer-events: none;
            opacity: 0.6;
            z-index: 0;
            animation: drift 15s ease-in-out infinite alternate;
        }

        .glowing-blob.secondary {
            top: 50%;
            left: 70%;
            background: radial-gradient(circle, rgba(68, 136, 238, 0.15) 0%, transparent 70%);
            animation: drift 20s ease-in-out infinite alternate-reverse;
        }

        @keyframes drift {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, -50px) scale(1.15); }
        }

        /* ── CARD ── */
        .card {
            position: relative;
            z-index: 1;
            width: 380px;
            background: var(--surface);
            border: 1px solid var(--rule);
            border-radius: 16px;
            backdrop-filter: blur(16px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        /* Neon top bar line */
        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent), #ff8833);
        }

        /* ── LOCK MARK ── */
        .lock-mark {
            width: 64px;
            height: 64px;
            background: var(--accent-dim);
            border: 1px solid var(--accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            position: relative;
            z-index: 1;
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .lock-mark svg {
            width: 26px;
            height: 26px;
            stroke: var(--accent);
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .card-header {
            padding: 32px 32px 16px;
            text-align: center;
        }

        .system-label {
            font-family: var(--mono);
            font-size: 11px;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 6px;
            font-weight: 500;
        }

        .card-title {
            font-size: 24px;
            font-weight: 800;
            color: #fff;
            letter-spacing: -0.02em;
        }

        .card-body {
            padding: 16px 32px 32px;
        }

        /* ── ERROR ── */
        .error-box {
            background: rgba(255, 85, 51, 0.1);
            border: 1px solid rgba(255, 85, 51, 0.3);
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 13px;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 10px;
            animation: shake 0.4s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }

        .error-box svg {
            flex-shrink: 0;
            stroke: var(--accent);
            fill: none;
            stroke-width: 2;
        }

        /* ── FORM ── */
        .field {
            margin-bottom: 20px;
        }

        .field-label {
            display: block;
            font-family: var(--mono);
            font-size: 10px;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--text-dim);
            margin-bottom: 8px;
        }

        .field-input-wrapper {
            position: relative;
        }

        .field-input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--rule);
            border-radius: 8px;
            color: var(--text);
            font-family: var(--sans);
            font-size: 14px;
            outline: none;
            transition: all 0.2s ease;
        }

        .field-input::placeholder { color: #40405c; }

        .field-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 10px rgba(255, 85, 51, 0.15);
            background: rgba(0, 0, 0, 0.6);
        }

        .btn-login {
            width: 100%;
            margin-top: 24px;
            padding: 14px;
            background: linear-gradient(90deg, var(--accent), #ff7733);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-family: var(--mono);
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 15px var(--accent-glow);
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 85, 51, 0.4);
            filter: brightness(1.1);
        }

        .btn-login:active { transform: translateY(0); }

        /* ── FOOTER BAR ── */
        .card-footer {
            padding: 16px 32px;
            border-top: 1px solid var(--rule);
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 0, 0, 0.2);
        }

        .footer-dot {
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent);
            animation: blink 2s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .footer-text {
            font-family: var(--mono);
            font-size: 9px;
            letter-spacing: 0.08em;
            color: var(--text-dim);
            text-transform: uppercase;
        }

        .meta-row {
            margin-top: 24px;
            font-family: var(--mono);
            font-size: 11px;
            color: var(--text-dim);
            text-align: center;
            letter-spacing: 0.05em;
            z-index: 1;
        }
    </style>
</head>
<body>

    <div class="glowing-blob"></div>
    <div class="glowing-blob secondary"></div>

    <div class="lock-mark">
        <svg viewBox="0 0 24 24" stroke="currentColor">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
    </div>

    <div class="card">
        <div class="card-header">
            <p class="system-label">Honeypot Console</p>
            <h1 class="card-title">Security Gateway</h1>
        </div>

        <div class="card-body">
            {% if error %}
            <div class="error-box">
                <svg width="18" height="18" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="10"/>
                    <line x1="12" y1="8" x2="12" y2="12"/>
                    <line x1="12" y1="16" x2="12.01" y2="16"/>
                </svg>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form method="POST">
                <div class="field">
                    <label class="field-label" for="username">Username</label>
                    <div class="field-input-wrapper">
                        <input
                            class="field-input"
                            type="text"
                            id="username"
                            name="username"
                            placeholder="username"
                            autocomplete="username"
                            required
                        >
                    </div>
                </div>
                <div class="field">
                    <label class="field-label" for="password">Password</label>
                    <div class="field-input-wrapper">
                        <input
                            class="field-input"
                            type="password"
                            id="password"
                            name="password"
                            placeholder="••••••••••••"
                            autocomplete="current-password"
                            required
                        >
                    </div>
                </div>

                <button class="btn-login" type="submit">
                    Authenticate
                    <span style="font-size: 14px;">→</span>
                </button>
            </form>
        </div>

        <div class="card-footer">
            <div class="footer-dot"></div>
            <span class="footer-text">Monitoring intrusion triggers & audit loops</span>
        </div>
    </div>

    <div class="meta-row">
        All sessions are cryptographically logged
    </div>

</body>
</html>
